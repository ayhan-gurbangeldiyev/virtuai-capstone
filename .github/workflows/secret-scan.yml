name: Secret Scan

# Compares a fresh scan of the working tree against a committed,
# audited baseline (.secrets.baseline). Fails ONLY when a finding
# appears that is not present in the baseline — i.e. a genuinely-new
# leak candidate.
#
# Refresh the baseline locally:
#   detect-secrets scan \
#     --exclude-files 'node_modules|\.git/|build/|venv/|\.vercel/|\.next/|package-lock\.json|local\.db|\.pytest_cache/|^output/static/|^\.secrets\.baseline$' \
#     > .secrets.baseline
# then mark each `results[*][*].is_secret` to true/false and add a
# `note` explaining why (or run `detect-secrets audit .secrets.baseline`
# interactively), and commit.
#
# IMPORTANT — prefer inline pragma over baseline churn:
# When you ADD a new key-shaped variable on a stub/test/example line
# (e.g. CI env stubs like `FOO_SECRET: "stub"`) the KeywordDetector
# fires and the baseline goes stale on every such commit. Instead of
# re-auditing the baseline, annotate the SPECIFIC LINE in place:
#   FOO_SECRET: "stub"  # pragma: allowlist secret
# Pros: detector still runs on every other variable, no file-exclude
# widening, pragma travels with the line. Only re-audit the baseline
# when a finding survives all three of: file change, value change,
# AND was already proven to be a non-secret.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  detect-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: pip install detect-secrets==1.5.0

      - name: Fresh scan into /tmp
        run: |
          detect-secrets scan \
            --exclude-files 'node_modules|\.git/|build/|venv/|\.vercel/|\.next/|package-lock\.json|local\.db|\.pytest_cache/|^output/static/|^\.secrets\.baseline$' \
            > /tmp/fresh.baseline

      - name: Diff fresh scan against committed baseline
        # New finding = (file, line_number, type) present in fresh but not in baseline.
        # Baseline is authoritative. Drift causes the job to fail with a
        # readable diff so the operator either rotates the secret or
        # audits + commits the new entry.
        run: |
          python - <<'PY'
          import json, sys
          baseline = json.load(open('.secrets.baseline'))
          fresh = json.load(open('/tmp/fresh.baseline'))

          def key_set(blob):
              s = set()
              for fpath, items in blob.get('results', {}).items():
                  for it in items:
                      s.add((fpath, it.get('line_number'), it.get('type')))
              return s

          base_keys = key_set(baseline)
          fresh_keys = key_set(fresh)
          new_findings = fresh_keys - base_keys
          if new_findings:
              print('::error::Secret-Scan detected NEW findings not in .secrets.baseline:')
              for k in sorted(new_findings):
                  print(f'  - {k[0]}:{k[1]} ({k[2]})')
              print('')
              print('Either rotate the leaked value at its provider AND remove it from the repo,')
              print('OR (if false-positive) audit it into .secrets.baseline:')
              print('  detect-secrets scan --exclude-files \'node_modules|\\.git/|build/|venv/|\\.vercel/|\\.next/|package-lock\\.json|local\\.db|\\.pytest_cache/|^output/static/\' > .secrets.baseline')
              print('  detect-secrets audit .secrets.baseline')
              print('  git add .secrets.baseline && git commit')
              sys.exit(1)
          print(f'OK: 0 new finding(s); baseline has {len(base_keys)} audited entries.')
          PY

      - name: Verify baseline contains no unaudited entries
        # Hard requirement: every entry must have is_secret set explicitly.
        # If someone re-generates the baseline without auditing, this
        # guard surfaces it.
        run: |
          python - <<'PY'
          import json, sys
          d = json.load(open('.secrets.baseline'))
          unaudited = [(f, it.get('line_number'), it.get('type'))
                       for f, items in d.get('results', {}).items()
                       for it in items if it.get('is_secret') is None]
          if unaudited:
              print('::error::Unaudited findings in .secrets.baseline:')
              for u in unaudited:
                  print(f'  - {u[0]}:{u[1]} ({u[2]})')
              print('Set is_secret + a note for each entry, then re-commit.')
              sys.exit(1)
          total = sum(len(v) for v in d.get('results', {}).values())
          print(f'Baseline integrity OK: {total} audited entries, 0 unaudited.')
          PY
