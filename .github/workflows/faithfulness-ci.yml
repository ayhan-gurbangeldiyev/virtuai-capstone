name: Faithfulness Gate + Choke-Point CI

# Stage 1.5 — blocking CI for the gate's structural invariants.
# Runs on every push + PR. Two checks, both must pass:
#   1. test_postiz_choke_point.py — no direct PostizClient or
#      .schedule_posts outside the GuardedPostizClient wrapper.
#   2. test_faithfulness_gate.py --enforce — full 225-case benchmark
#      with the documented thresholds (recall calibrated 1.0,
#      precision ≥0.85, FP-on-grounded ≤0.05, T0 recall ≥0.98).
#
# The second check requires GLiNER + the live LLM (Gemini via
# OpenRouter). We DO NOT bundle the API key into the CI job by default
# — it gates on `OPENROUTER_API_KEY` being present as a repo secret.
# When the secret is absent (e.g. external contributor PR), the
# benchmark is skipped with a warning; the choke-point test still runs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  choke-point:
    name: Choke-point invariant (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimum runtime deps for choke-point test
        # The choke-point test imports tools.guarded_postiz which transitively
        # touches supabase + httpx. Install only the lightweight runtime
        # deps — NOT the GLiNER/transformers heavy chain.
        run: |
          python -m pip install --upgrade pip
          pip install "supabase>=2.0" "httpx>=0.27" "pydantic>=2.5" \
                      "python-dotenv>=1.0" "loguru>=0.7"

      - name: Run choke-point invariant
        working-directory: hype_crew
        # The choke-point test is offline — it parses the file tree
        # and asserts structural invariants. But the imports it makes
        # go through hype_crew/config.py which calls _required(...)
        # for SUPABASE_URL etc. at module top. Provide stub values so
        # the import succeeds; nothing in the test path actually
        # connects to those URLs.
        env:
          SUPABASE_URL: "https://stub.invalid"
          SUPABASE_SERVICE_KEY: "stub"            # pragma: allowlist secret
          OPENROUTER_API_KEY: "stub"              # pragma: allowlist secret
          POSTIZ_API_KEY: "stub"                  # pragma: allowlist secret
          CRON_SECRET: "stub"                     # pragma: allowlist secret
          FAITHFULNESS_GATE_SECRET: "stub-ci-secret"  # pragma: allowlist secret
        run: |
          python tests/test_postiz_choke_point.py

  faithfulness-benchmark:
    name: Benchmark + --enforce (recall, precision, FP)
    runs-on: ubuntu-latest
    needs: choke-point
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gliner-multi-v1

      - name: Install hype_crew requirements (gliner, rapidfuzz, transformers)
        run: |
          python -m pip install --upgrade pip
          pip install -r hype_crew/requirements.txt

      - name: Run benchmark with --enforce
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FAITHFULNESS_NER_REQUIRED: "true"
        run: |
          if [ -z "${OPENROUTER_API_KEY}" ]; then
            echo "::warning::OPENROUTER_API_KEY not set; skipping LLM-tier benchmark."
            echo "Choke-point invariant has already passed."
            exit 0
          fi
          cd hype_crew
          python tests/test_faithfulness_gate.py --concurrency 6 --enforce
